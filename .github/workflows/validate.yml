name: Validate Next.js site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # report_builder invokes the shared Node/AJV gate before writing a report.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Validate Python scripts
        run: |
          python -m pip install -r scripts/requirements.txt
          python -c "import playwright"
          python -m compileall -q scripts tests
          python -m unittest discover -s tests -p "test_*.py"

      - name: Validate content
        run: npm run validate:content

      - name: Typecheck
        run: npm run typecheck

      - name: Run checks
        run: npm test

      - name: Build site
        run: npm run build
